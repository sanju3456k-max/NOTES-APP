<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Notes Studio Pro</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Lucide Icons & JSZip -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <!-- KaTeX (Instant Math Rendering in Live Preview) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

</head>
<body>
  <div id="root"></div>
  <template id="app-markup">
  <!-- =========================================================
       VIEW 1: HOME SCREEN (PROJECTS & CHAPTERS DASHBOARD)
       ========================================================= -->
  <section id="home-view" class="view active">
    <header class="app-header">
      <div class="header-left">
        <h1 class="app-title">Notes <span class="text-primary">Studio</span></h1>
      </div>

    </header>

    <main id="html-projects-container" class="home-content">
      <section class="home-hero" aria-labelledby="home-hero-title">
        <div class="home-hero-copy">
          <span class="home-eyebrow"><i data-lucide="sparkles" class="icon-xs"></i> YOUR LEARNING SPACE</span>
          <h2 id="home-hero-title">Good ideas start with a blank page.</h2>
          <p>Create a chapter, collect your notes, and shape them into something worth revisiting.</p>
          <div class="home-hero-actions">
            <button class="btn-primary-pill" onclick="createNewProject()">
              <i data-lucide="plus" class="icon-sm"></i>
              <span>New project</span>
            </button>
            <label for="hidden-html-import" class="btn-outline-pill" style="cursor:pointer;">
              <i data-lucide="file-up" class="icon-sm"></i>
              <span>Import notes</span>
            </label>
          </div>
        </div>
        <div class="home-hero-art" aria-hidden="true">
          <div class="hero-orbit hero-orbit-one"></div>
          <div class="hero-orbit hero-orbit-two"></div>
          <div class="hero-note-card">
            <i data-lucide="notebook-pen" class="hero-note-icon"></i>
            <span>Ideas become<br><strong>understanding.</strong></span>
            <div class="hero-note-lines"><i></i><i></i><i></i></div>
          </div>
        </div>
        <button class="icon-btn-circle home-theme-toggle" onclick="toggleDarkMode()" title="Toggle Theme" aria-label="Toggle theme">
          <i data-lucide="moon" class="icon-sm"></i>
        </button>
      </section>

      <div class="section-header home-projects-heading">
        <div>
          <span class="home-section-kicker">YOUR LIBRARY</span>
          <h2 class="section-title">Projects & chapters</h2>
          <p class="section-subtitle">Pick up where you left off, or open a project to explore its notes.</p>
        </div>
        <span id="project-count-label" class="count-badge">3 Projects</span>
      </div>

      <div id="projects-list" class="projects-grid"></div>
    </main>

  </section>


  <!-- =========================================================
       VIEW 2: STUDIO WORKSPACE (EDITOR & LIVE PREVIEW CANVAS)
       ========================================================= -->
  <section id="studio-view" class="view">
    <header class="studio-header">
      <div class="header-left">
        <button class="icon-btn" onclick="closeStudioToHome()" title="Back to Projects">
          <i data-lucide="arrow-left"></i>
        </button>
        <h1 class="app-title"><span class="text-primary">Notes</span> Studio</h1>
      </div>
      <div class="header-right">
        <button class="icon-btn-surface" id="save-note-btn" onclick="saveActiveNote(true)" title="Save Note">
          <i data-lucide="file-check-2" class="icon-sm text-primary"></i>
        </button>
        <button class="studio-menu-btn" onclick="openStudioOptionsModal()" title="Studio Options" aria-label="Open Studio menu">
          <i data-lucide="more-vertical" class="icon-sm"></i>
          <span>Menu</span>
        </button>
      </div>
    </header>

    <!-- Primary Studio Toolbar -->
    <div class="studio-toolbar">
      <div class="toolbar-left">
        <button class="tool-btn" onclick="toggleSlideDrawer()" title="Files, Outline & Margins">
          <i data-lucide="list-tree" class="icon-sm"></i>
        </button>
        <button class="tool-btn" onclick="editorUndo()" title="Undo">
          <i data-lucide="undo-2" class="icon-sm"></i>
        </button>
        <button class="tool-btn" onclick="editorRedo()" title="Redo">
          <i data-lucide="redo-2" class="icon-sm"></i>
        </button>
        <button class="tool-btn" onclick="toggleSearchBar()" title="Find in Note">
          <i data-lucide="search" class="icon-sm"></i>
        </button>

      </div>

      <div class="toolbar-right">
        <button id="preview-edit-toggle" class="tool-btn preview-edit-toggle" onclick="togglePreviewEditMode()" aria-pressed="false" aria-label="Edit preview text and add images" title="Edit preview text and add images">
          <i data-lucide="pencil" class="icon-sm" aria-hidden="true"></i>
        </button>
        <div class="view-mode-pills">
          <button id="btn-mode-editor" class="mode-pill" onclick="setStudioViewMode('editor')">
            <i data-lucide="code" class="icon-xs"></i>
            <span>Editor</span>
          </button>
          <button id="btn-mode-split" class="mode-pill desktop-only" onclick="setStudioViewMode('split')">
            <i data-lucide="columns" class="icon-xs"></i>
            <span>Split</span>
          </button>
          <button id="btn-mode-preview" class="mode-pill active" onclick="setStudioViewMode('preview')">
            <i data-lucide="eye" class="icon-xs"></i>
            <span>Preview</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Collapsible Search Bar -->
    <div id="studio-search-bar" class="studio-search-bar hidden">
      <div class="search-inner">
        <i data-lucide="search" class="icon-xs text-muted"></i>
        <input type="text" id="studio-search-input" placeholder="Find text or LaTeX formula..." oninput="performStudioSearch(this.value)" />
        <span id="search-match-count" class="search-count">0/0</span>
        <button class="icon-btn-xs" onclick="toggleSearchBar()"><i data-lucide="x"></i></button>
      </div>
    </div>

    <!-- File Tabs Row -->
    <div class="file-tabs-bar">
      <div id="file-tabs-scroll" class="file-tabs-scroll"></div>
      <div class="file-tabs-actions">
        <button class="tab-action-btn" onclick="addNewNoteTab()" title="New File Tab">
          <i data-lucide="plus" class="icon-sm"></i>
        </button>
        <button class="tab-action-btn" onclick="enterFullscreenPreview()" title="Full Screen Preview">
          <i data-lucide="maximize-2" class="icon-xs"></i>
        </button>
      </div>
    </div>

    <!-- Fullscreen Header -->
    <div id="fullscreen-bar" class="fullscreen-bar hidden">
      <div class="fs-left">
        <i data-lucide="file-text" class="icon-sm text-primary"></i>
        <span id="fs-file-title" class="fs-title">FT1</span>
      </div>
      <div class="fs-right">
        <div class="zoom-controls">
          <button onclick="adjustPreviewZoom(-10)">−</button>
          <span id="zoom-level-text">100%</span>
          <button onclick="adjustPreviewZoom(10)">+</button>
        </div>
        <button class="btn-fs-exit" onclick="exitFullscreenPreview()">
          <i data-lucide="minimize-2" class="icon-sm"></i>
        </button>
      </div>
    </div>

    <!-- Main Workspace Body -->
    <div id="workspace-body" class="workspace-body mode-preview">
      <!-- LEFT PANE: CODE EDITOR -->
      <div id="editor-pane" class="workspace-pane editor-pane">
        <div class="code-editor-wrapper">
          <div id="line-numbers" class="line-numbers">1</div>
          <textarea
            id="html-code-editor"
            class="code-textarea"
            spellcheck="false"
            placeholder="Paste or write your HTML + LaTeX/KaTeX code here..."
          ></textarea>
        </div>
        <footer class="editor-status-bar">
          <div class="status-left">
            <span id="status-file-name">FT1</span>
            <span class="status-divider">|</span>
            <span id="status-line-count">0 lines</span>
          </div>
          <div class="status-right">
            <span id="status-image-info" class="status-badge-info hidden">WebP Ready</span>
            <span>HTML / KaTeX</span>
          </div>
        </footer>
      </div>

      <div id="split-divider" class="split-divider" role="separator" aria-label="Resize editor and preview panes" aria-orientation="vertical" aria-valuemin="25" aria-valuemax="75" aria-valuenow="50" tabindex="0"></div>

      <!-- RIGHT PANE: DIRECT INTERACTIVE PREVIEW CANVAS -->
      <div id="preview-pane" class="workspace-pane preview-pane">
        <div class="preview-edit-toolbar">
          <label id="preview-image-upload-label" for="hidden-image-upload" class="tool-btn tool-btn-accent preview-image-upload hidden" title="Add image to preview">
            <i data-lucide="image-plus" class="icon-sm"></i>
            <span>+ Image</span>
          </label>
        </div>
        <!-- Floating Image Manipulation Toolbar (Appears when any image in Preview is tapped) -->
        <div id="image-context-toolbar" class="image-context-toolbar hidden">
          <span class="img-toolbar-label">Wrap:</span>
          <button class="img-tool-btn" onclick="setSelectedImageWrap('left')" title="Float Left & Wrap Text">
            ⬅ Left
          </button>
          <button class="img-tool-btn" onclick="setSelectedImageWrap('none')" title="Break Text / Center">
            ⬌ Center
          </button>
          <button class="img-tool-btn" onclick="setSelectedImageWrap('right')" title="Float Right & Wrap Text">
            Right ➡
          </button>
          <span class="toolbar-sep"></span>
          <button class="img-tool-btn" onclick="scaleSelectedImage(0.30)">30%</button>
          <button class="img-tool-btn" onclick="scaleSelectedImage(0.50)">50%</button>
          <button class="img-tool-btn" onclick="scaleSelectedImage(0.75)">75%</button>
          <button class="img-tool-btn" onclick="scaleSelectedImage(1.0)">100%</button>
          <span class="toolbar-sep"></span>
          <button class="img-tool-btn" onclick="moveSelectedImageUpDown(-1)" title="Move Image Up in Document">⬆</button>
          <button class="img-tool-btn" onclick="moveSelectedImageUpDown(1)" title="Move Image Down in Document">⬇</button>
          <span class="toolbar-sep"></span>
          <button class="img-tool-btn text-danger" onclick="deleteSelectedImage()" title="Delete Image">✕</button>
        </div>

        <!-- Live Interactive Preview Surface -->
        <div id="preview-scroll-wrapper" class="preview-scroll-wrapper">
          <div id="preview-canvas" class="preview-canvas"></div>
        </div>
      </div>
    </div>

    <!-- SLIDE-OVER LEFT DRAWER -->
    <div id="drawer-backdrop" class="drawer-backdrop hidden" onclick="toggleSlideDrawer(false)"></div>
    <aside id="slide-drawer" class="slide-drawer">
      <div class="drawer-header">
        <div class="drawer-tabs">
          <button id="dtab-files" class="dtab" onclick="switchDrawerTab('files')">Files</button>
          <button id="dtab-outline" class="dtab active" onclick="switchDrawerTab('outline')">
            Outline (<span id="outline-count">0</span>)
          </button>
          <button id="dtab-margins" class="dtab" onclick="switchDrawerTab('margins')">Margins</button>
        </div>
        <button class="icon-btn-xs" onclick="toggleSlideDrawer(false)"><i data-lucide="x"></i></button>
      </div>

      <!-- TAB 1: FILES -->
      <div id="dpanel-files" class="drawer-panel hidden">
        <div class="drawer-search-box">
          <i data-lucide="search" class="icon-xs text-muted"></i>
          <input type="text" placeholder="Search files in notes..." oninput="filterDrawerFiles(this.value)" />
        </div>
        <div class="drawer-project-subheader">
          <span id="drawer-project-title" class="drawer-proj-name">STRAIGHT LINE</span>
          <div class="drawer-proj-actions">
            <button class="icon-btn-xs" onclick="downloadFullProjectZip()"><i data-lucide="download" class="icon-xs"></i></button>
            <button class="btn-xs-primary" onclick="addNewNoteTab()">+ Add File</button>
          </div>
        </div>
        <div id="drawer-files-list" class="drawer-files-list"></div>
      </div>

      <!-- TAB 2: OUTLINE -->
      <div id="dpanel-outline" class="drawer-panel">
        <div class="outline-subheader">
          <span>DOCUMENT HEADINGS (<span id="outline-sub-count">0</span>)</span>
          <span>Click to navigate</span>
        </div>
        <div id="outline-list" class="outline-list"></div>
      </div>

      <!-- TAB 3: MARGINS -->
      <div id="dpanel-margins" class="drawer-panel hidden">
        <div class="margins-top-card">
          <div class="margins-top-row">
            <strong>Preview Defaults: <span id="margin-summary-label">8mm 5mm</span></strong>
            <button class="text-btn-primary" onclick="resetMarginsToDefault()">Reset (0mm)</button>
          </div>
          <p class="margins-subtext">Print defaults: 10mm vertical & 6mm side (applied automatically when printing).</p>
        </div>

        <div class="margin-control-box">
          <div class="margin-row-label">
            <span>Left Binding Gutter (<span id="val-gutter">5mm</span>)</span>
            <span class="text-primary">Total Left: <strong id="val-total-left">10mm</strong></span>
          </div>
          <input type="range" id="slider-gutter" min="0" max="25" value="5" oninput="updateMarginSettings()" />
          <button class="btn-booklet-gutter" onclick="applyBookletGutter()">
            <i data-lucide="book-open" class="icon-xs"></i>
            <span>+15mm Booklet Gutter</span>
          </button>
        </div>

        <div class="margin-slider-group">
          <div class="margin-row-label">
            <span class="slider-title">SIDE MARGINS</span>
            <span class="slider-badge" id="val-side-margin">5mm</span>
          </div>
          <input type="range" id="slider-side" min="0" max="30" value="5" oninput="updateMarginSettings()" />
        </div>

        <div class="margin-slider-group">
          <div class="margin-row-label">
            <span class="slider-title">VERTICAL MARGINS</span>
            <span class="slider-badge" id="val-vert-margin">8mm</span>
          </div>
          <input type="range" id="slider-vert" min="0" max="30" value="8" oninput="updateMarginSettings()" />
        </div>

        <div class="margin-slider-group">
          <div class="margin-row-label">
            <span class="slider-title">FONT SIZE</span>
            <span class="slider-badge" id="val-font-size">15px</span>
          </div>
          <input type="range" id="slider-font" min="11" max="24" value="15" oninput="updateMarginSettings()" />
        </div>
      </div>
    </aside>

    <!-- STUDIO OPTIONS MODAL -->
    <div id="studio-options-modal" class="modal-backdrop hidden" onclick="closeStudioOptionsModal()">
      <div class="studio-modal-card" onclick="event.stopPropagation()">
        <div class="modal-header">
          <span class="modal-title">STUDIO OPTIONS</span>
          <button class="icon-btn-xs" onclick="closeStudioOptionsModal()"><i data-lucide="x"></i></button>
        </div>

        <div class="modal-options-list">
          <label for="hidden-html-import" class="modal-option-item" style="cursor:pointer;" onclick="closeStudioOptionsModal()">
            <i data-lucide="file-up" class="icon-sm"></i>
            <div class="opt-text"><strong>Import .html File</strong></div>
          </label>

          <button class="modal-option-item highlighted" onclick="downloadFullProjectZip()">
            <i data-lucide="folder-down" class="icon-sm text-primary"></i>
            <div class="opt-text">
              <strong class="text-primary">Download Full Project</strong>
              <span id="modal-zip-subtext">4 files included</span>
            </div>
            <span class="zip-badge">ZIP</span>
          </button>

          <button class="modal-option-item" onclick="downloadCurrentNoteHTML()">
            <i data-lucide="download" class="icon-sm"></i>
            <div class="opt-text">
              <strong>Download .html File</strong>
              <span>Current active note</span>
            </div>
          </button>

          <button class="modal-option-item" onclick="openVersionHistory()">
            <i data-lucide="history" class="icon-sm"></i>
            <div class="opt-text"><strong>Version History</strong></div>
          </button>

          <button class="modal-option-item" onclick="triggerPrintDocument()">
            <i data-lucide="printer" class="icon-sm"></i>
            <div class="opt-text"><strong>Print Document</strong></div>
          </button>

          <div class="modal-divider"></div>

          <button class="modal-option-item danger" onclick="deleteActiveNote()">
            <i data-lucide="trash-2" class="icon-sm"></i>
            <div class="opt-text"><strong>Delete Note</strong></div>
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- GLOBAL PRINT READY BOTTOM TOAST (Shows in both Home & Studio Views) -->
  <div id="print-ready-toast" class="print-toast hidden">
    <div class="print-toast-header">
      <div class="print-toast-title">
        <i data-lucide="printer" class="icon-sm text-primary"></i>
        <span>Print Ready</span>
      </div>
      <button class="icon-btn-xs" onclick="closePrintToast()"><i data-lucide="x"></i></button>
    </div>
    <p class="print-toast-desc">Choose how you want to print or save your formatted note:</p>
    <div class="print-toast-actions">
      <button class="btn-primary-block" onclick="executeDirectPrint()">
        <i data-lucide="printer" class="icon-sm"></i>
        <span>Open & Print Now</span>
      </button>
      <button class="btn-secondary-icon" onclick="downloadPrintReadyHTML()">
        <i data-lucide="download" class="icon-sm"></i>
        <span>Save Printable HTML</span>
      </button>
    </div>
  </div>

  <!-- Hidden File Inputs -->
  <input type="file" id="hidden-html-import" accept=".html,.htm" class="hidden" onchange="handleHTMLFileImport(event)" />
  <input type="file" id="hidden-image-upload" accept="image/*" class="hidden" onchange="handleSmartImageUpload(event)" />

  </template>
  <script type="module" src="./index.jsx"></script>
</body>
</html>
